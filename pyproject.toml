[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "routing-aware-atos"
version = "0.1.0"
description = "Routing Aware Activation Transport Operators"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "torch>=2.2",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "numcodecs>=0.15",
  "zarr>=3.0",
]

[project.optional-dependencies]
gemma-scope = [
  "sae-lens>=5.0.0",
]
real-model = [
  "transformers>=5.0",
  "accelerate>=0.33",
  "datasets>=2.20",
  "huggingface-hub>=0.34",
]
test = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
